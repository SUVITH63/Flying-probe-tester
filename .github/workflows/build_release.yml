name: Build & Release FPTester Executable App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: FPTester-Windows.exe
            asset_name: FPTester-Windows-x64.exe
          - os: macos-latest
            artifact_name: FPTester-App
            asset_name: FPTester-macOS-x64
          - os: ubuntu-latest
            artifact_name: FPTester-App
            asset_name: FPTester-Linux-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          python -m PyInstaller --onefile --add-data "frontend;frontend" --name "FPTester-Windows" run_app.py || python -m PyInstaller --onefile --add-data "frontend:frontend" --name "FPTester-App" run_app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Create GitHub Release with App Binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Built Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          name: FPTester Standalone Release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
